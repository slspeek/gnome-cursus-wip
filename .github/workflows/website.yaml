name: Website

on: push

env:
  BUILD_DIR: build
  WEBSITE_DIR: build/gnome-cursus
  LANG: "nl_NL.UTF-8"

jobs:
  marp:
    runs-on: ubuntu-latest
    steps:
      - name: Generate dutch locale
        run: sudo locale-gen ${{ env.LANG }}
      - name: Checkout 
        uses: actions/checkout@v3
      - name: Run makefile targets website print and gnome-cursus.zip
        run: make website print ${{ env.BUILD_DIR }}/gnome-cursus.zip
      - name: Deploy to github pages
        uses: peaceiris/actions-gh-pages@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./${{ env.WEBSITE_DIR }}
      - name: Release gnome-cursus.zip
        uses: softprops/action-gh-release@v2.2.1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.BUILD_DIR }}/gnome-cursus.zip
